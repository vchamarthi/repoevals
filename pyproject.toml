[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "repoevals"
version = "0.1.0"
description = "Repo-agnostic, deterministic evaluations for AI coding agents: declare tasks in your repo, grade them without an LLM."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["tomli>=2.0; python_version < '3.11'"]
keywords = ["ai-agents", "evaluation", "benchmark", "coding-agents", "scientific-computing", "swe-bench", "mutation-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
numeric = ["numpy>=1.23"]
dev = ["pytest>=7", "numpy>=1.23"]

[project.scripts]
repoevals = "repoevals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repoevals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
