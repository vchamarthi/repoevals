[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "repoevals"
version = "0.3.0"
description = "Repository-native evaluations for AI coding agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["tomli>=2.0; python_version < '3.11'"]
keywords = ["ai-agents", "evaluation", "benchmark", "coding-agents", "scientific-computing", "swe-bench", "mutation-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
numeric = ["numpy>=1.23"]
dev = ["pytest>=7", "numpy>=1.23", "ruff>=0.6", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/vchamarthi/repoevals"
Documentation = "https://github.com/vchamarthi/repoevals/tree/main/docs"
Issues = "https://github.com/vchamarthi/repoevals/issues"
Changelog = "https://github.com/vchamarthi/repoevals/blob/main/CHANGELOG.md"

[project.scripts]
repoevals = "repoevals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repoevals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.hatch.build.targets.wheel.force-include]
"docs/agent-playbook.md" = "repoevals/data/agent_playbook.md"
"examples/starter-configs" = "repoevals/data/presets"
