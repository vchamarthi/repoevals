name: agentexam
description: Validate, self-check, run and report deterministic AI-coding-agent evals defined in your repository.
author: vchamarthi
branding:
  icon: check-square
  color: blue

inputs:
  command:
    description: "validate | check | run | report | guidance-lint"
    default: check
  tasks:
    description: Space-separated task ids / prefixes (id*) / family:<f> / tag:<t>. Empty = all tasks.
    default: ""
  changed-only:
    description: "check: only tasks whose directory changed relative to the PR base (falls back to all)"
    default: "true"
  config:
    description: Path to agentexam.toml (default: search from the repository root)
    default: ""
  repeats:
    description: "check: oracle repeats (flakiness). run: repeats per task and arm."
    default: "1"
  agent:
    description: "run: claude-code | codex | noop | cmd:<template>"
    default: noop
  model:
    description: "run: model id passed to the agent CLI"
    default: ""
  arms:
    description: "run: space-separated arms, e.g. 'guidance:raw guidance:none'"
    default: "guidance:raw"
  runs-dir:
    description: "run/report: directory for run outputs"
    default: agentexam-runs
  python-version:
    description: Python used to run agentexam itself
    default: "3.12"
  agentexam-version:
    description: "pip requirement for agentexam (default: this action's checkout)"
    default: ""

outputs:
  report:
    description: Path of the Markdown report (run/report)
    value: ${{ steps.main.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install agentexam
      shell: bash
      run: |
        if [ -n "${{ inputs.agentexam-version }}" ]; then
          python -m pip install -q "${{ inputs.agentexam-version }}"
        else
          python -m pip install -q "${{ github.action_path }}"
        fi
    - name: agentexam ${{ inputs.command }}
      id: main
      shell: bash
      env:
        AE_CMD: ${{ inputs.command }}
        AE_TASKS: ${{ inputs.tasks }}
        AE_CHANGED: ${{ inputs.changed-only }}
        AE_CONFIG: ${{ inputs.config }}
        AE_REPEATS: ${{ inputs.repeats }}
        AE_AGENT: ${{ inputs.agent }}
        AE_MODEL: ${{ inputs.model }}
        AE_ARMS: ${{ inputs.arms }}
        AE_RUNS: ${{ inputs.runs-dir }}
        AE_BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        cfg=()
        [ -n "$AE_CONFIG" ] && cfg=(--config "$AE_CONFIG")
        tasks=($AE_TASKS)
        if [ "$AE_CMD" = "check" ] && [ "$AE_CHANGED" = "true" ] && [ -n "$AE_BASE" ] && [ ${#tasks[@]} -eq 0 ]; then
          tdir=$(python -c "from agentexam.config import load_config; c=load_config(); print(c.tasks)" 2>/dev/null || echo .agent-evals/tasks)
          git fetch -q --depth=1 origin "$AE_BASE" || true
          mapfile -t tasks < <(git diff --name-only "$AE_BASE" -- "$tdir" | awk -F/ -v d="$tdir" '{sub(d"/","",$0); split($0,a,"/"); print a[1]}' | sort -u)
          echo "changed tasks: ${tasks[*]:-<none, checking all>}"
        fi
        case "$AE_CMD" in
          validate)      agentexam "${cfg[@]}" validate "${tasks[@]}" ;;
          check)         agentexam "${cfg[@]}" check --repeats "$AE_REPEATS" --json agentexam-check.json "${tasks[@]}" ;;
          guidance-lint) agentexam "${cfg[@]}" guidance-lint ;;
          run)
            arms=(); for a in $AE_ARMS; do arms+=(--arm "$a"); done
            model=(); [ -n "$AE_MODEL" ] && model=(--model "$AE_MODEL")
            agentexam "${cfg[@]}" run --agent "$AE_AGENT" "${model[@]}" "${arms[@]}" --repeats "$AE_REPEATS" --out "$AE_RUNS" "${tasks[@]}"
            agentexam report "$AE_RUNS" --out "$AE_RUNS/report"
            echo "report=$AE_RUNS/report/summary.md" >> "$GITHUB_OUTPUT" ;;
          report)
            agentexam report "$AE_RUNS" --out "$AE_RUNS/report"
            echo "report=$AE_RUNS/report/summary.md" >> "$GITHUB_OUTPUT" ;;
          *) echo "unknown command $AE_CMD"; exit 2 ;;
        esac
