name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff pyyaml
      - run: ruff check src tests
      - name: action.yml and workflows are valid YAML
        run: python -c "import yaml, glob; [yaml.safe_load(open(f)) for f in ['action.yml', *glob.glob('.github/workflows/*.yml')]]"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*

  action:
    # the composite action itself, against the bundled example repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repoevals
      - name: Prepare the example repository
        run: |
          cp -R repoevals/examples/minisci minisci
          cd minisci
          git init -q -b main && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm init
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pytest
      - name: validate (composite action)
        uses: ./repoevals
        with:
          command: validate
          config: minisci/repoevals.toml
      - name: check (composite action)
        uses: ./repoevals
        with:
          command: check
          config: minisci/repoevals.toml
          repeats: "2"
      - name: run noop agent and report (composite action)
        uses: ./repoevals
        id: run
        with:
          command: run
          agent: noop
          repeats: "1"
          config: minisci/repoevals.toml
      - run: test -f "${{ steps.run.outputs.report }}" && head -20 "${{ steps.run.outputs.report }}"
