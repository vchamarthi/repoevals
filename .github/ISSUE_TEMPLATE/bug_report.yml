name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security problems, do not open an issue; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, a minimal task or config, and the relevant part of grade.json or the error output.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: repoevals version
      description: Output of `repoevals --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, test adapter, agent
      placeholder: Ubuntu 24.04, Python 3.12, pytest, claude-code
    validations:
      required: true
