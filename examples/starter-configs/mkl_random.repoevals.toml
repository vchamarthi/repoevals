# Starter config for IntelPython/mkl_random (meson-python + mkl-devel).
[repo]
id = "mkl_random"
url = "https://github.com/IntelPython/mkl_random"

[guidance]
globs = ["**/AGENTS.md", ".github/copilot-instructions.md", ".github/instructions/*.md"]

[policy]
test_globs = ["mkl_random/tests/**"]
library_globs = ["mkl_random/**"]

[test]
adapter = "pytest"
build = "python -m pip install -e . --no-build-isolation -q"
command = "python -m pytest -q -p no:randomly {targets}"
timeout_sec = 1800
env = { MKL_NUM_THREADS = "2", OMP_NUM_THREADS = "2" }
