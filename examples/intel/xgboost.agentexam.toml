# Starter config for dmlc/xgboost (Intel CPU / SYCL plugin work). Untested scaffold.
[repo]
id = "xgboost"
url = "https://github.com/dmlc/xgboost"

[policy]
test_globs = ["tests/**"]
library_globs = ["src/**", "plugin/**", "include/**", "python-package/xgboost/**"]

[test]
adapter = "ctest"
build = "cmake -S . -B build -GNinja -DGOOGLE_TEST=ON -DPLUGIN_SYCL=OFF && cmake --build build -j4"
command = "ctest --test-dir build --output-on-failure {targets}"
timeout_sec = 3600
